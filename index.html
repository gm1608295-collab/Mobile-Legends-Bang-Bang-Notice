<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Login System</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Arial, sans-serif;
            padding: 20px;
        }
        .card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }
        h2 { text-align: center; color: #333; margin-bottom: 30px; }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            margin: 10px 0;
            font-weight: bold;
        }
        button:hover { background: #5a6fd8; }
        .row-buttons {
            display: flex;
            gap: 10px;
            margin: 15px 0;
        }
        .row-buttons button {
            background: white;
            color: #667eea;
            border: 1px solid #667eea;
            margin: 0;
        }
        .row-buttons button:hover { background: #f0f0ff; }
        .link { text-align: center; margin-top: 15px; }
        .link a { color: #667eea; cursor: pointer; text-decoration: none; }
        .message {
            text-align: center;
            padding: 10px;
            margin-top: 10px;
            border-radius: 10px;
            font-size: 14px;
        }
        .error { background: #fee; color: #c33; }
        .success { background: #efe; color: #3c3; }
        .admin-link {
            text-align: center;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #eee;
        }
        .admin-link a { color: #e74c3c; font-size: 12px; text-decoration: none; }
    </style>
</head>
<body>
    <div class="card">
        <div id="loginView">
            <h2>Sign in</h2>
            <input type="email" id="loginEmail" placeholder="Email">
            <input type="password" id="loginPassword" placeholder="Password">
            <button onclick="doLogin()">Sign in</button>
            <div class="row-buttons">
                <button onclick="doGuest()">Guest</button>
                <button onclick="window.location.href='/auth/google'">Google</button>
            </div>
            <div class="link"><a onclick="showSignup()">Create account</a></div>
            <div class="admin-link"><a href="/admin-login.html">🔐 Admin Access</a></div>
        </div>
        <div id="signupView" style="display:none">
            <h2>Create account</h2>
            <input type="text" id="signupUsername" placeholder="Username">
            <input type="tel" id="signupPhone" placeholder="Phone">
            <input type="email" id="signupEmail" placeholder="Email">
            <input type="password" id="signupPassword" placeholder="Password">
            <input type="password" id="signupConfirm" placeholder="Confirm password">
            <button onclick="doSignup()">Sign up</button>
            <div class="link"><a onclick="showLogin()">Back to sign in</a></div>
        </div>
        <div id="message" class="message"></div>
    </div>

    <script>
        // Session Persistence - Check if user already logged in
        const currentUser = localStorage.getItem('currentUser');
        if (currentUser) {
            window.location.href = '/dashboard.html';
        }

        // Local Login (Fake - with persistence)
        async function doLogin() {
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            
            if (!email || !password) {
                showMsg('Please fill all fields', 'error');
                return;
            }
            
            // Get users from localStorage
            let users = JSON.parse(localStorage.getItem('users') || '[]');
            const user = users.find(u => u.email === email && u.password === password);
            
            if (user) {
                // Save current user session
                localStorage.setItem('currentUser', JSON.stringify({
                    id: user.id,
                    email: user.email,
                    username: user.username,
                    role: user.role || 'user',
                    loginTime: new Date().toISOString()
                }));
                showMsg('Login successful! Redirecting...', 'success');
                setTimeout(() => {
                    window.location.href = '/dashboard.html';
                }, 1000);
            } else {
                showMsg('Invalid email or password', 'error');
            }
        }

        // Signup
        async function doSignup() {
            const username = document.getElementById('signupUsername').value;
            const phone = document.getElementById('signupPhone').value;
            const email = document.getElementById('signupEmail').value;
            const password = document.getElementById('signupPassword').value;
            const confirm = document.getElementById('signupConfirm').value;
            
            if (!email || !password) {
                showMsg('Email and password required', 'error');
                return;
            }
            if (password !== confirm) {
                showMsg('Passwords do not match', 'error');
                return;
            }
            
            let users = JSON.parse(localStorage.getItem('users') || '[]');
            
            // Check if email exists
            if (users.find(u => u.email === email)) {
                showMsg('Email already exists', 'error');
                return;
            }
            
            // Create new user
            const newUser = {
                id: Date.now(),
                username: username || 'User',
                phone: phone || '',
                email: email,
                password: password,
                role: 'user',
                createdAt: new Date().toISOString()
            };
            
            users.push(newUser);
            localStorage.setItem('users', JSON.stringify(users));
            
            showMsg('Signup successful! Please login.', 'success');
            setTimeout(() => showLogin(), 2000);
        }

        // Guest Login
        async function doGuest() {
            // Create temporary guest session
            const guestId = 'guest_' + Date.now();
            localStorage.setItem('currentUser', JSON.stringify({
                id: guestId,
                email: 'guest@example.com',
                username: 'Guest',
                role: 'guest',
                loginTime: new Date().toISOString(),
                isGuest: true
            }));
            window.location.href = '/dashboard.html';
        }

        function showMsg(msg, type) {
            const m = document.getElementById('message');
            m.className = 'message ' + type;
            m.innerText = msg;
            setTimeout(() => { m.innerText = ''; }, 3000);
        }

        function showLogin() {
            document.getElementById('loginView').style.display = 'block';
            document.getElementById('signupView').style.display = 'none';
        }
        
        function showSignup() {
            document.getElementById('loginView').style.display = 'none';
            document.getElementById('signupView').style.display = 'block';
        }
    </script>
</body>
</html>
