<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>MLBB Golden Month</title>

<script src="https://www.google.com/recaptcha/api.js" async defer></script>

<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>

<style>

body{
background:#0b0e1a;
color:white;
font-family:Arial;
text-align:center;
padding-top:60px;
}

.box{
width:350px;
margin:auto;
background:#141833;
padding:30px;
border-radius:10px;
box-shadow:0 0 15px gold;
}

input{
width:90%;
padding:10px;
margin:10px;
border-radius:5px;
border:none;
}

button{
background:gold;
border:none;
padding:12px 30px;
font-size:18px;
border-radius:6px;
cursor:pointer;
}

#result{
margin-top:20px;
font-size:20px;
color:gold;
}

</style>
</head>

<body>

<div class="box">

<h2>MLBB Golden Month Spin</h2>

<input type="text" id="name" placeholder="Your Name">

<input type="email" id="email" placeholder="Your Email">

<br>

<div class="g-recaptcha"
data-sitekey="6LfqYoosAAAAACAJM8GFiuPx2HgfzP9CliL2ojYd"></div>

<br><br>

<button onclick="spin()">SPIN</button>

<div id="result"></div>

</div>

<script>

(function(){
emailjs.init("tsKN2j9o6RYK4KeEp");
})();

function spin(){

var captcha = grecaptcha.getResponse();

if(captcha.length == 0){
alert("Please verify captcha!");
return;
}

var rewards = [
"100 Gold",
"200 Gold",
"300 Gold",
"500 Gold",
"1 Spin Ticket",
"Better luck next time"
];

var random = Math.floor(Math.random()*rewards.length);

var reward = rewards[random];

document.getElementById("result").innerHTML =
"You won: "+reward;

var name = document.getElementById("name").value;
var email = document.getElementById("email").value;

emailjs.send("service_3akzfls","template_xqygsga",{
from_name:name,
email:email,
reward:reward
}).then(function(){

alert("Reward sent to email!");

});

grecaptcha.reset();

}

</script>

</body>
</html>
